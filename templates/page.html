{% extends "base.html" %}
{% set active_page = page.slug %}

{% block title %}{{ page.title }} — {{ site.title }}{% endblock %}
{% block description %}{{ page.title }} — {{ site.title }}{% endblock %}

{% block content %}
<main class="main">
    <div class="container container--narrow">
        <h1 class="section__title">{{ page.title }}</h1>
        <div class="md-content">
            {{ page.body | safe }}
        </div>
    </div>
</main>
{% endblock %}

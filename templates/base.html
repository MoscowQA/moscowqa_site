<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site.title }}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@600&family=Ubuntu:wght@300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%23F7DF1F'/><text y='72' x='12' font-size='60' font-family='sans-serif' font-weight='bold'>QA</text></svg>">
</head>
<body>
    <header class="header">
        <div class="header__inner">
            <a href="/" class="header__logo">
                <div class="header__logo-icon">QA</div>
                Moscow QA
            </a>
            <button class="header__burger" onclick="document.querySelector('.header__nav').classList.toggle('open')" aria-label="Меню">&#9776;</button>
            <nav class="header__nav">
                <a href="/" {% if active_page == 'index' %}class="active"{% endif %}>Главная</a>
                <a href="/events/" {% if active_page == 'events' %}class="active"{% endif %}>Мероприятия</a>
                <a href="/speakers/" {% if active_page == 'speakers' %}class="active"{% endif %}>Спикеры</a>
                <a href="/cfp/" {% if active_page == 'cfp' %}class="active"{% endif %}>CFP</a>
            </nav>
        </div>
    </header>

    {% block content %}{% endblock %}

    <footer class="footer">
        <div class="footer__inner">
            <div class="footer__col">
                <div class="footer__copyright">&copy; 2024 &mdash; {{ now_year }}, Moscow QA Team</div>
                <div class="footer__links">
                    <a href="/events/">Мероприятия</a>
                    <a href="/speakers/">Спикеры</a>
                    <a href="/cfp/">Стать спикером</a>
                </div>
            </div>
            <div class="footer__col">
                <div class="footer__social">
                    <a href="{{ site.telegram }}" title="Telegram" aria-label="Telegram">&#9993;</a>
                    <a href="{{ site.youtube }}" title="YouTube" aria-label="YouTube">&#9654;</a>
                    <a href="{{ site.timepad }}" title="Timepad" aria-label="Timepad">&#9733;</a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>

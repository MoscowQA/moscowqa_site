name: Build and Deploy

on:
  push:
    branches: [main]
  # Ночная пересборка. Прошло событие или ещё нет, теперь считается на сборке
  # (build.py, `split_events`), а не в браузере — без этого расписания разбивка
  # на главной застывала бы на дне последнего деплоя.
  #
  # 01:00 UTC — это 04:00 по Москве: к утру сайт уже знает, что вчерашний
  # митап прошёл. GitHub отключает расписание после 60 дней без коммитов в
  # репозиторий — тогда его надо включить обратно на вкладке Actions.
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python build.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
